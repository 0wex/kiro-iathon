<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Desastres naturales</title>
  </head>
  <body class="app-body">
    <div class="dash xr-viewer">
      <header class="dash-header">
        <h1>Desastres naturales</h1>
        <span class="badge badge-info">Datos de ejemplo</span>
      </header>
      <aside class="dash-events" aria-label="Eventos">
        <h2>Eventos</h2>
        <ul class="dash-event-list"></ul>
      </aside>
      <main class="dash-map" aria-label="Mapa 3D"></main>
      <aside class="dash-card" aria-live="polite">
        <p class="dash-card-empty">Elige un evento de la lista o del mapa.</p>
        <div class="dash-card-body" hidden>
          <p class="dash-card-kind"></p>
          <h2 class="dash-card-title">Evento</h2>
          <dl class="dash-card-facts"></dl>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/pages/dashboard.ts"></script>
  </body>
</html>
